name: Render UI previews
on:
  push:
    branches: ['ui/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  previews:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore, test and publish
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Render previews with demo data
        shell: pwsh
        run: |
          $out = Join-Path $PWD 'artifacts/previews'
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath 'artifacts/publish/Aion2PetTracker.exe' -ArgumentList '--render-preview', "`"$out`"" -Wait -PassThru
          Get-ChildItem $out | Format-Table Name, Length
          if (Test-Path (Join-Path $out 'preview-error.txt')) { Get-Content (Join-Path $out 'preview-error.txt') }
          if ($p.ExitCode -ne 0) { throw "Preview rendering failed with exit code $($p.ExitCode)" }
      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-previews
          path: artifacts/previews/
          if-no-files-found: warn
